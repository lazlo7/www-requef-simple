name: Push a new github release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website-release
  cancel-in-progress: true

jobs:
  pack-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download assets
        run: |
          ./scripts/bootstrap.sh

      - name: Pack site
        run: tar --numeric-owner --owner=0 --group=0 -czvf site.tar.gz src

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          latest_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [[ "$GITHUB_SHA" != "$latest_sha" ]]; then
            echo "A newer commit exists. Skipping release."
            exit 0
          fi

          tag="site-${GITHUB_SHA}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists."
            exit 0
          fi

          gh release create "$tag" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Website ${GITHUB_SHA:0:12}" \
            --notes "Built from commit ${GITHUB_SHA}" \
            --latest \
            site.tar.gz

          gh release edit "$tag" --draft=false
